<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded card -->
  <rect width="64" height="64" rx="14" fill="#070a12" stroke="#ff6b00" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Head Chassis -->
  <rect x="14" y="18" width="36" height="32" rx="7" fill="#131c2e" stroke="#00e5ff" stroke-width="2"/>
  <!-- Ear Audio Nodes -->
  <rect x="10" y="27" width="4" height="14" rx="2" fill="#ff6b00"/>
  <rect x="50" y="27" width="4" height="14" rx="2" fill="#ff6b00"/>
  <!-- Glowing Cyan Visor -->
  <rect x="19" y="25" width="26" height="8" rx="3" fill="url(#neonCyan)" filter="url(#glow)"/>
  <!-- Antenna Post & Emissive Core -->
  <line x1="32" y1="18" x2="32" y2="8" stroke="#ff6b00" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="7" r="4.5" fill="#ff6b00" filter="url(#glow)"/>
  <!-- Mouth / Speaker Grille Line -->
  <line x1="24" y1="41" x2="40" y2="41" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
